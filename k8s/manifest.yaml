# Kubernetes manifest for the notification pub/sub system.
#
#   kubectl apply -f k8s/manifest.yaml
#   kubectl -n notifications port-forward svc/frontend 8080:8080   # inbox
#   kubectl -n notifications port-forward svc/api 3000:3000        # dashboard
#
# The application images are the ones produced by `docker compose build`.
# A cluster cannot pull those local names: push them to your registry and
# replace the four `image:` values (api, worker, webhook, frontend), or load
# them into a local cluster (kind load docker-image / minikube image load).
apiVersion: v1
kind: Namespace
metadata:
  name: notifications
---
# Credentials. Replace every "change-me" value before applying, and keep the
# password inside MONGODB_URI identical to MONGO_INITDB_ROOT_PASSWORD. Better
# still, delete this block from the file and create the Secret out of band:
#
#   kubectl -n notifications create secret generic notification-secrets \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=notifications \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD=... \
#     --from-literal=MONGODB_URI='mongodb://notifications:...@mongodb:27017/notification_service?authSource=admin' \
#     --from-literal=REDIS_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: notifications
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: notifications
  MONGO_INITDB_ROOT_PASSWORD: change-me-mongo
  MONGODB_URI: mongodb://notifications:change-me-mongo@mongodb:27017/notification_service?authSource=admin
  REDIS_PASSWORD: change-me-redis
---
# Non-sensitive settings shared by the API and the workers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: notifications
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_MAX_RETRIES: "10"
  DISPATCH_FAILURE_RATE: "0.3"
  DISPATCH_MAX_RETRIES: "3"
  WEBHOOK_URI: http://webhook:3010/webhook
---
# ---------------------------------------------------------------- MongoDB
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: notifications
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: notifications
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6-jammy
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# ------------------------------------------------------------------ Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: notifications
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: notifications
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# -------------------------------------------------------------------- API
# REST API, SSE endpoint and the sender dashboard.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: notifications
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: notifications
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: notification-pub-sub-system-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: MONGODB_URI
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: notification-config
          # /health checks both MongoDB and Redis
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ----------------------------------------------------------------- Worker
# Queue consumers. No Service: workers only make outbound connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: notifications
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: notification-pub-sub-system-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: MONGODB_URI
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: notification-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ---------------------------------------------------------------- Webhook
# Example consumer of the batch-completion webhook. Cluster-internal.
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: notifications
spec:
  selector:
    app: webhook
  ports:
    - name: http
      port: 3010
      targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: webhook
          image: notification-pub-sub-system-webhook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
          env:
            - name: PORT
              value: "3010"
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
# --------------------------------------------------------------- Frontend
# Inbox page. nginx proxies /api and the SSE stream to the api Service.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: notifications
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: notification-pub-sub-system-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://api:3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
# ---------------------------------------------------------------- Ingress
# Optional public entry points. Replace the two hosts with your own domains.
# The annotations keep long-lived SSE connections open on ingress-nginx;
# other ingress controllers ignore them and may need their own equivalent.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notifications
  namespace: notifications
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: inbox.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
